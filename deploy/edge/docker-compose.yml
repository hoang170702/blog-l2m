# Shared edge proxy for every environment on the server (run once, from /opt/edge):
#   docker network create edge   # once
#   ACME_EMAIL=you@example.com docker compose up -d
# Traefik terminates TLS with Let's Encrypt certificates and routes by host name to the
# `web` container of each application stack (labels in deploy/docker-compose.yml).

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: '5'

services:
  traefik:
    image: traefik:v3.7
    command:
      - --providers.docker=true
      - --providers.docker.endpoint=tcp://socket-proxy:2375
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=edge
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.websecure.address=:443
      - --entrypoints.websecure.http3=false
      - --certificatesresolvers.le.acme.email=${ACME_EMAIL:?set ACME_EMAIL}
      - --certificatesresolvers.le.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.le.acme.httpchallenge.entrypoint=web
      - --certificatesresolvers.le.acme.caserver=${ACME_CA_SERVER:-https://acme-v02.api.letsencrypt.org/directory}
      - --api.dashboard=false
      - --accesslog=true
      - --log.level=INFO
    ports:
      - ${EDGE_HTTP_PORT:-80}:80
      - ${EDGE_HTTPS_PORT:-443}:443
    volumes:
      - letsencrypt:/letsencrypt
    networks: [edge, docker-api]
    depends_on: [socket-proxy]
    restart: unless-stopped
    logging: *logging

  # Read-only Docker API for Traefik: container discovery only, no socket in the
  # internet-facing container.
  socket-proxy:
    image: tecnativa/docker-socket-proxy:3.4
    environment:
      CONTAINERS: 1
      NETWORKS: 1
      SERVICES: 0
      TASKS: 0
      POST: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [docker-api]
    restart: unless-stopped
    logging: *logging

networks:
  edge:
    external: true
    name: edge
  docker-api:
    internal: true

volumes:
  letsencrypt:
